[package]
name = "cider-api"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Giorgio Brullo"]
license = "MPL-2.0"
description = "Async Rust client for the Cider music player REST API"
readme = "README.md"
repository = "https://github.com/giorgiobrullo/cider-api"
homepage = "https://docs.rs/cider-api"
keywords = ["cider", "apple-music", "music", "playback", "async"]
categories = ["api-bindings", "multimedia::audio", "asynchronous"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true

[features]
# Real-time event stream over Cider's Socket.IO endpoint (`V2::events`).
events = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Event stream (feature `events`)
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6"
